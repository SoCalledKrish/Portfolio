name: Abhiram-Portfolio

services:
  app:
    build: 
      context: ..
      dockerfile: Dockerfile
  
    container_name: abhiram-portfolio
    environment:
      APP_NAME: "Abhiram's Portfolio"
      VERSION: "1.0.0"
      ENVIRONMENT: "production"
      DEBUG: "false"

    expose:
      - "8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - abhiram-portfolio-network

  nginx:
    image: nginx:alpine
    container_name: abhiram-portfolio-nginx
    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - abhiram-portfolio-network
  
networks:
    abhiram-portfolio-network:
      driver: bridge